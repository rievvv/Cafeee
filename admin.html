<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafeee Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body data-page="admin">
<header class="top coffee"><div class="brand">Cafeee Admin</div><button class="btn ghost sm" onclick="Auth.out()">Keluar</button></header>
<main class="wrap">
<div class="grid" id="stats"></div><br>
<div class="panel"><h3 id="ft">Tambah klien</h3>
<div class="grid">
<div><label>Nama cafe</label><input id="cn"></div>
<div><label>Paket</label><select id="cp"><option value="basic">Review — 100rb</option><option value="pro">Menu — 200rb</option></select></div>
<div><label>Link Google Review</label><input id="cr" placeholder="https://g.page/r/..."></div>
<div><label>Username dashboard (paket Menu)</label><input id="cu"></div>
<div><label>Password (kosongkan jika tidak diubah)</label><input id="cw" type="password"></div></div>
<div class="row"><button class="btn" id="save">Simpan klien</button><button class="btn ghost" id="cancel" style="display:none">Batal ubah</button></div></div>
<div class="panel"><h3>Daftar klien</h3><div style="overflow-x:auto"><table><tbody id="rows"></tbody></table></div></div>
</main>
<div class="modal" id="qrModal"><div class="panel center" style="padding:20px"><h3 id="qt"></h3><div id="qrbox"></div><p style="font-size:.8rem;word-break:break-all;margin:10px 0" id="qu"></p>
<div class="row" style="justify-content:center"><button class="btn" id="dl">Unduh PNG</button><button class="btn ghost" id="qx">Tutup</button></div></div></div>
<script src="app.js"></script><script src="script.js"></script></body></html>
