<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body data-page="dashboard">
<header class="top coffee"><div class="brand" id="cname">Dashboard</div><div class="row"><a class="btn light sm" id="viewMenu" href="#">Lihat menu</a><button class="btn ghost sm" onclick="Auth.out()">Keluar</button></div></header>
<main class="wrap">
<div class="panel"><h3 id="ft">Tambah menu</h3>
<div class="grid"><div><label>Nama</label><input id="mn"></div><div><label>Harga</label><input id="mp" type="number" min="0"></div><div><label>Kategori</label><input id="mc" placeholder="Minuman / Makanan"></div></div>
<div class="row"><button class="btn" id="save">Simpan menu</button><button class="btn ghost" id="cancel" style="display:none">Batal ubah</button></div></div>
<div class="panel"><h3>Daftar menu</h3><table><tbody id="rows"></tbody></table></div>
<div class="panel dark"><h3>Buat nota</h3><div id="pick" class="grid" style="margin:10px 0"></div>
<div id="cart"></div><div class="row"><strong id="tot">Total Rp 0</strong><button class="btn light" id="print">Cetak nota</button><button class="btn ghost" id="clr">Kosongkan</button></div></div>
</main>
<div id="nota"></div>
<script src="app.js"></script><script src="script.js"></script></body></html>
